name: Build AstroROM
run-name: Building ROM for ${{ inputs.device }}
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Choose objective / Device Model'
        required: true
        default: 'SM-A045F'
      upload_cloud:
        description: 'Upload ROM to cloud (PixelDrain)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Install essential tools
        run: |
          apt-get update && apt-get install -y \
            git \
            curl \
            rsync \
            gawk \
            coreutils \
            findutils \
            util-linux \
            bash \
            nodejs \
            procps \
            openjdk-17-jdk
            
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Disk Space Check
        run: df -h /

      - name: Run AstroROM Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          bash build.sh --build ${{ inputs.device }}
          
      - name: Download PixelDrain CLI (pd)
        if: ${{ inputs.upload_cloud }}
        run: |
          curl -L https://github.com/jkawamoto/go-pixeldrain/releases/download/v0.7.6/pd_0.7.6_linux_amd64.tar.gz -o pd.tar.gz
          tar -xvf pd.tar.gz
          chmod +x pd
          mv pd /usr/local/bin/pd
          
      - name: Upload ROM to PixelDrain
        if: ${{ inputs.upload_cloud }}
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [ -d "out" ]; then
            cd out
            ROM_FILE=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ROM_FILE" ]; then
              echo "No ROM zip found in out directory!"
              exit 1
            fi
            echo "Uploading $ROM_FILE to PixelDrain..."
            pd --api-key "$PIXELDRAIN_API_KEY" upload "$ROM_FILE" | sed 's|api/file|u|g'
          else
            echo "Error: 'out' directory does not exist!"
            exit 1
          fi
